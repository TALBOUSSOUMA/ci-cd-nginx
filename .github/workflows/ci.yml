name: CI - Build & Test

on:
 workflow_dispatch
 

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Vérifier les fichiers
        run: |
          test -f Dockerfile && echo "Dockerfile OK"
          test -f nginx.conf && echo "nginx.conf OK"
          test -f index.html && echo "index.html OK"

      - name: Build image Docker
        run: docker build -t nginx-ci-demo .

      - name: Tester la config Nginx
        run: docker run --rm nginx-ci-demo nginx -t

      - name: Lancer le conteneur
        run: |
          docker run -d --name nginx-test -p 8080:80 nginx-ci-demo
          sleep 2

      - name: Tester le service
        run: curl --fail http://localhost:8080/ || exit 1