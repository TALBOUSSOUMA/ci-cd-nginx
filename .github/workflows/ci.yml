name: CI - Engineer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les fichiers essentiels
        run: |
          for f in Dockerfile nginx.conf index.html; do
            test -f $f || (echo "❌ $f manquant" && exit 1)
          done

      - name: Construire l'image Docker
        run: docker build -t nginx-ci-demo .

      - name: Tester la configuration Nginx
        run: docker run --rm nginx-ci-demo nginx -t

      - name: Lancer Nginx
        run: |
          docker run -d --name nginx-test -p 8080:80 nginx-ci-demo
          sleep 2

      - name: Tester la page d'accueil
        run: curl --fail http://localhost:8080/ | grep -q "Déploiement automatisé"

      - name: Tester l'endpoint /health
        run: curl --fail http://localhost:8080/health | grep -q "healthy"