name: CI/CD - Architect

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Convertir le nom du dépôt en minuscules
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et tagger avec le SHA
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.REPO_LOWER }}"
          docker build -t $IMAGE:${{ github.sha }} .
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest

      - name: Pousser l'image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.REPO_LOWER }}"
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://github.com/TALBOUSSOUMA/ci-cd-nginx
    steps:
      - run: echo "Déploiement staging de ${{ github.sha }}"

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/TALBOUSSOUMA/ci-cd-nginx
    steps:
      - run: echo "Mise en production de ${{ github.sha }}"